<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover → we can read safe-area insets on notched phones.
     user-scalable=no + touch-action:none kills double-tap zoom & 300ms delay. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d1a">
<title>Orbit Rush</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   ORBIT RUSH — styles. Dark, high-contrast, thumb-sized touch targets.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  /* Safe-area insets (0 on non-notched devices / desktop browsers). */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  /* Height reserved for the AdMob banner; set from JS when a banner shows
     so no UI or gameplay-critical info ever sits behind the ad. */
  --banner-h: 0px;
  --ink:#eef1ff; --dim:#8b93b8; --accent:#5ef2c8; --accent2:#ff5e8a;
  --panel:#141830f2; --btn:#232a52;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  position:fixed; inset:0; overflow:hidden;
  background:#0b0d1a; color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  touch-action:none;                 /* no browser gestures, no tap delay */
  user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;
}
canvas#game{position:absolute; inset:0; width:100%; height:100%; display:block}

/* Invisible probes: their computed height gives us the safe-area inset in px
   so the canvas renderer (which can't read env()) can offset the HUD. */
#probe-top{position:absolute;top:0;height:var(--sat);width:1px;visibility:hidden}
#probe-bottom{position:absolute;bottom:0;height:calc(var(--sab) + var(--banner-h));width:1px;visibility:hidden}

/* ── Overlay screens ────────────────────────────────────────────────── */
.screen{
  position:absolute; inset:0; z-index:10;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:calc(var(--sat) + 16px) 22px calc(var(--sab) + var(--banner-h) + 16px);
  background:radial-gradient(120% 90% at 50% 10%, #141a3ae6 0%, #0b0d1ae6 70%);
  backdrop-filter:blur(2px);
  text-align:center;
}
.screen.hidden{display:none}
h1.logo{
  font-size:clamp(38px,11vw,64px); font-weight:900; letter-spacing:.04em;
  background:linear-gradient(90deg,var(--accent),#7aa2ff 55%,var(--accent2));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:logoFloat 3.2s ease-in-out infinite;   /* subtle live menu motion */
}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
.tag{color:var(--dim);font-size:15px;margin-top:-8px}

button{
  font:inherit; color:var(--ink); border:0; cursor:pointer;
  background:var(--btn); border-radius:14px;
  padding:14px 22px; min-height:52px; min-width:64px;  /* thumb-sized */
  font-size:17px; font-weight:700;
  transition:transform .08s;
}
button:active{transform:scale(.95)}
button.primary{
  background:linear-gradient(135deg,var(--accent),#38b6ff); color:#06251d;
  font-size:22px; padding:18px 54px; border-radius:18px;
  box-shadow:0 6px 30px #5ef2c855;
  animation:pulseBtn 1.6s ease-in-out infinite;
}
@keyframes pulseBtn{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
button.ad{background:linear-gradient(135deg,#ffb648,#ff5e8a);color:#2b1200}
button.ghostbtn{background:#ffffff14}
button:disabled{opacity:.35; animation:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.statline{color:var(--dim);font-size:14px}
.statline b{color:var(--ink)}
.bigscore{font-size:clamp(52px,18vw,96px);font-weight:900;line-height:1}
.newbest{color:var(--accent);font-weight:900;letter-spacing:.12em;animation:pulseBtn 1s infinite}

/* XP bar (start + game-over screens) */
.xpwrap{width:min(320px,80vw)}
.xpbar{height:10px;background:#ffffff14;border-radius:6px;overflow:hidden}
.xpbar>i{display:block;height:100%;width:0%;border-radius:6px;
  background:linear-gradient(90deg,var(--accent),#7aa2ff);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xplabel{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}

/* Ghost bar: last run vs best */
.ghost{position:relative;width:min(320px,80vw);height:14px;background:#ffffff10;border-radius:7px}
.ghost>i.you{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:#5ef2c8aa}
.ghost>i.mark{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--accent2);border-radius:2px}
.ghost>span{position:absolute;right:6px;top:-18px;font-size:11px;color:var(--dim)}

/* Missions */
.missions{display:flex;flex-direction:column;gap:6px;width:min(340px,86vw)}
.mission{display:flex;align-items:center;gap:10px;background:#ffffff0d;border-radius:12px;
  padding:9px 12px;font-size:13px;text-align:left}
.mission .mprog{margin-left:auto;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.mission.done{background:#5ef2c81f}
.mission.done .mprog{color:var(--accent)}

/* Unlocks browser */
#unlocks .tabs{display:flex;gap:8px}
#unlocks .tabs button{padding:10px 16px;min-height:44px;font-size:14px}
#unlocks .tabs button.on{background:var(--accent);color:#06251d}
.grid{display:grid;grid-template-columns:repeat(4,64px);gap:10px;max-height:44vh;
  overflow-y:auto;padding:6px;touch-action:pan-y}
.cell{width:64px;height:64px;border-radius:14px;border:2px solid #ffffff22;position:relative;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.cell.eq{border-color:var(--accent);box-shadow:0 0 12px #5ef2c866}
.cell.lock{opacity:.42}
.cell .cost{position:absolute;bottom:3px;left:0;right:0;font-size:9px;color:#fff;text-shadow:0 1px 2px #000}
.cell .badge{position:absolute;top:-6px;right:-6px;background:var(--accent2);color:#fff;
  font-size:8px;font-weight:900;padding:2px 5px;border-radius:8px;letter-spacing:.05em;
  animation:pulseBtn 1.2s infinite}
.cell.arm{border-color:#ffc94d;box-shadow:0 0 14px #ffc94daa;animation:pulseBtn .7s infinite}
#shop-dot{color:var(--accent2);font-size:22px;line-height:0;vertical-align:middle;margin-left:4px}

/* Toast banners (level-up, unlock, streak, milestone) */
#toasts{position:absolute;top:calc(var(--sat) + 54px);left:0;right:0;z-index:30;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{
  background:var(--panel);border:1px solid #ffffff2a;border-radius:14px;
  padding:10px 20px;font-weight:800;font-size:16px;
  animation:toastIn .35s cubic-bezier(.2,1.4,.4,1), toastOut .4s ease-in 2.6s forwards;
  box-shadow:0 8px 30px #00000088;
}
.toast.big{font-size:20px;padding:14px 26px}
@keyframes toastIn{from{transform:translateY(-30px) scale(.8);opacity:0}}
@keyframes toastOut{to{transform:translateY(-16px);opacity:0}}

/* Level-up full-screen flash + rising number */
#lvlfx{position:absolute;inset:0;z-index:25;pointer-events:none;display:none;
  align-items:center;justify-content:center}
#lvlfx.on{display:flex;animation:lvlFlash .9s ease-out}
#lvlfx .num{font-size:clamp(70px,26vw,150px);font-weight:900;color:#fff;
  text-shadow:0 0 30px var(--accent),0 0 60px #38b6ff;
  animation:lvlRise 1.1s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes lvlFlash{0%{background:#5ef2c84d}100%{background:transparent}}
@keyframes lvlRise{0%{transform:translateY(50px) scale(.5);opacity:0}
  30%{opacity:1}100%{transform:translateY(-40px) scale(1.15);opacity:0}}

/* In-game pause button */
#btn-pause{position:absolute;top:calc(var(--sat) + 10px);right:12px;z-index:5;
  width:46px;height:46px;min-width:46px;min-height:46px;padding:0;border-radius:50%;
  background:#ffffff14;font-size:18px;display:none}

/* small util */
.hidden{display:none !important}
.dimtxt{color:var(--dim);font-size:12px;max-width:300px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="probe-top"></div><div id="probe-bottom"></div>
<button id="btn-pause" aria-label="Pause">II</button>
<div id="toasts"></div>
<div id="lvlfx"><div class="num" id="lvlfx-num">2</div></div>

<!-- ── START SCREEN ─────────────────────────────────────────────────── -->
<div class="screen" id="start">
  <h1 class="logo">ORBIT RUSH</h1>
  <div class="tag">tap to release · land in the next ring</div>
  <div class="statline">BEST <b id="s-best">0</b> · STREAK <b id="s-streak">0</b>🔥 · <b id="s-rebirth"></b></div>
  <div class="statline">🪙 <b id="s-coins">0</b> coins</div>
  <div class="xpwrap">
    <div class="xplabel"><span>LVL <b id="s-level">1</b></span><span id="s-xptext">0 / 100 XP</span></div>
    <div class="xpbar"><i id="s-xpfill"></i></div>
  </div>
  <button class="primary" id="btn-play">PLAY</button>
  <div class="row">
    <button class="ghostbtn" id="btn-unlocks">🛒 Shop<span id="shop-dot" class="hidden">•</span></button>
    <button class="ghostbtn" id="btn-sound">🔊</button>
    <button class="ghostbtn" id="btn-fx">✨ FX: HI</button>
  </div>
  <button class="ghostbtn hidden" id="btn-rebirth">🌀 REBIRTH — permanent XP boost</button>
  <div class="missions" id="s-missions"></div>
  <button class="ghostbtn" id="btn-privacy" style="min-height:40px;padding:8px 14px;font-size:12px;font-weight:400">Privacy &amp; ad options</button>
</div>

<!-- ── GAME OVER SCREEN ─────────────────────────────────────────────── -->
<div class="screen hidden" id="over">
  <div class="newbest hidden" id="o-newbest">★ NEW BEST ★</div>
  <div class="bigscore" id="o-score">0</div>
  <div class="statline" id="o-miss"></div>
  <div class="ghost"><span>best <b id="o-bestn">0</b></span><i class="you" id="o-you"></i><i class="mark" id="o-mark"></i></div>
  <div class="statline" id="o-xp"></div>
  <div class="statline" id="o-coins"></div>
  <div class="xpwrap">
    <div class="xplabel"><span>LVL <b id="o-level">1</b></span><span id="o-xptext"></span></div>
    <div class="xpbar"><i id="o-xpfill"></i></div>
  </div>
  <div class="row">
    <button class="ad" id="btn-continue">▶ CONTINUE<br><small>watch ad · once</small></button>
    <button class="ad" id="btn-coinrevive">▶ CONTINUE<br><small>🪙 <span id="o-revcost">60</span></small></button>
    <button class="ad" id="btn-doublexp">2× XP<br><small>watch ad</small></button>
  </div>
  <button class="primary" id="btn-retry">RETRY</button>
  <button class="ghostbtn" id="btn-home">Home</button>
</div>

<!-- ── PAUSE SCREEN ─────────────────────────────────────────────────── -->
<div class="screen hidden" id="pause">
  <h1 class="logo" style="font-size:34px">PAUSED</h1>
  <button class="primary" id="btn-resume">RESUME</button>
  <div class="row">
    <button class="ghostbtn" id="btn-p-restart">Restart</button>
    <button class="ghostbtn" id="btn-p-home">Home</button>
  </div>
</div>

<!-- ── SHOP SCREEN ──────────────────────────────────────────────────── -->
<div class="screen hidden" id="unlocks">
  <h1 class="logo" style="font-size:30px">SHOP</h1>
  <div class="statline">🪙 <b id="u-coins">0</b> · lifetime XP <b id="u-xp">0</b></div>
  <div class="tabs">
    <button data-tab="trail" class="on">Colors</button>
    <button data-tab="skin">Skins</button>
    <button data-tab="bg">Worlds</button>
    <button data-tab="sound">Sound</button>
    <button data-tab="fx">FX</button>
  </div>
  <div class="grid" id="u-grid"></div>
  <div class="dimtxt">XP unlocks a tier · coins buy it. Tap an owned item to equip (sound &amp; FX preview on tap). New styles generate forever.</div>
  <button class="ghostbtn" id="btn-u-back">Back</button>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   ██  ORBIT RUSH — CONFIG BLOCK  ██
   Every tuning constant and every ad ID lives HERE and only here.
   ═══════════════════════════════════════════════════════════════════════ */
const CONFIG = {

  /* ── ADS (Google OFFICIAL TEST IDs — safe in dev, must not ship) ────
     Plugin: @capacitor-community/admob PINNED to 7.2.0 in package.json.
     The rewarded/interstitial event names used below are v7-specific
     (v8 renames them) — do not bump the major without updating Ads. ── */
  ADMOB_APP_ID:          "ca-app-pub-3940256099942544~3347511713", // TODO: replace before release (also in AndroidManifest.xml + capacitor.config.json!)
  BANNER_AD_UNIT_ID:     "ca-app-pub-3940256099942544/6300978111", // TODO: replace before release
  INTERSTITIAL_AD_UNIT_ID:"ca-app-pub-3940256099942544/1033173712",// TODO: replace before release
  REWARDED_AD_UNIT_ID:   "ca-app-pub-3940256099942544/5224354917", // TODO: replace before release
  ADS_ENABLED: true,            // master kill-switch for all ad code
  ADS_TESTING_MODE: true,       // requests test ads; set false for release
  ADS_INTERSTITIAL_EVERY_N_DEATHS: 3, // ⚖ revenue-vs-retention knob #1
  ADS_INTERSTITIAL_MIN_INTERVAL_S: 60,// never two interstitials within 60s
  REWARDED_DOUBLE_XP_MULT: 2,   // ⚖ revenue-vs-retention knob #2

  /* ── XP / LEVELS (endless: cost = BASE_XP · level^EXPONENT) ───────── */
  BASE_XP: 90,
  XP_LEVEL_EXPONENT: 1.5,
  XP_PER_POINT: 10,             // run score → XP conversion
  REBIRTH_LEVEL: 50,            // rebirth offered at/after this level
  REBIRTH_MULT_GAIN: 0.5,       // each rebirth: +0.5× permanent XP gain
  STREAK_BONUS_PER_DAY: 0.10,   // +10% XP per streak day…
  STREAK_BONUS_CAP: 1.0,        // …capped at +100%
  STREAK_DAILY_XP: 40,          // instant XP on first launch of the day × streak

  /* ── DIFFICULTY — smooth functions of rings-passed n and level L.
        No tiers: level 3 and level 300 use the same math, chaos clamped. */
  ORBIT_SPEED_BASE: 2.0,        // rad/s at n=0            ★ addictiveness knob
  ORBIT_SPEED_GROWTH: 0.045,    // + per ring passed        ★ addictiveness knob
  ORBIT_SPEED_LEVEL: 0.018,     // + ·√L (veterans start a touch faster)
  ORBIT_SPEED_MAX: 4.6,         // CLAMP: playable forever
  FLY_SPEED: 760,               // px/s (in 480-wide virtual units)
  ORBIT_GAP: 26,                // dot's orbit sits this far outside the ring
  DOT_R: 9,

  TARGET_R_BASE: 56,            // ring radius at n=0
  TARGET_R_SHRINK: 2.6,         // − ·√n
  TARGET_R_LEVEL: 0.5,          // − ·√L
  TARGET_R_MIN: 30,             // CLAMP ★ addictiveness knob
  TARGET_DIST_MIN: 170,         // spawn distance range from current ring
  TARGET_DIST_MAX: 250,
  TARGET_CONE_DEG: 52,          // spawn direction: up ± this many degrees

  FLIP_START_N: 6,              // rotation may flip after this many rings
  FLIP_CHANCE_GROWTH: 0.012,    // + per ring past start
  FLIP_CHANCE_LEVEL: 0.002,     // + per level
  FLIP_CHANCE_MAX: 0.35,        // CLAMP ★ addictiveness knob

  MOVE_START_N: 8,              // targets start moving after this many rings
  MOVE_AMP_GROWTH: 2.2,         // px amplitude per ring past start
  MOVE_AMP_MAX: 46,             // CLAMP
  MOVE_SPEED_BASE: 1.1,         // rad/s oscillation
  MOVE_SPEED_MAX: 2.2,          // CLAMP

  /* ── SCORING / FEEL ───────────────────────────────────────────────── */
  PERFECT_FRACTION: 0.38,       // hit within r·this = PERFECT ★ knob
  COMBO_MAX: 8,                 // multiplier cap
  NEAR_MISS_SHOW_PX: 30,        // show "missed by N px" up to this ★ knob
  DEATH_SLOWMO_S: 0.45,         // brief flight after a miss before game over

  /* ── COINS / SHOP ─────────────────────────────────────────────────── */
  COINS_PER_SCORE: 1,           // coins per score point at run end ★ tune this first
  COINS_COMBO_BONUS: 2,         // extra coins per PERFECT hit landed
  COIN_PRICE_BASE: 90,          // tier-1 shop item price
  COIN_PRICE_EXPONENT: 1.35,    // price of tier i = BASE · i^EXP (endless tiers)

  /* ── COIN REVIVE (no lives meter — restart is always free/instant).
        Price escalates per use WITHIN one run so it can't be spammed. ── */
  REVIVE_COIN_BASE: 60,         // first coin-revive of a run
  REVIVE_COIN_GROWTH: 3,        // ×3 for each additional revive in the same run

  /* ── RELEASE INDICATOR — long for onboarding, shrinks smoothly with
        level to a floor. Independent of TARGET_R_MIN by design. ─────── */
  INDICATOR_LEN_BASE: 44,       // tangent aim-line length at level 1
  INDICATOR_LEN_MIN: 14,        // floor — never fully disappears
  INDICATOR_SHRINK: 3.5,        // shrink ·√(level−1) between BASE and MIN

  /* ── PERFORMANCE / FX ─────────────────────────────────────────────── */
  DPR_CAP: 2,                   // cap devicePixelRatio for cheap GPUs
  PARTICLE_POOL: 160,           // fixed pool, zero per-frame allocation
  SHAKE_MAX: 9,                 // px screen shake at full strength
  VIRTUAL_W: 480,               // design width; world scales to real width

  /* ── UNLOCKS: cost of the i-th item (lifetime XP, i from 0) ───────── */
  UNLOCK_BASE: 350,
  UNLOCK_EXPONENT: 1.7,

  SAVE_KEY: "orbitRush.save.v1",
};
/* ═══════════════ END CONFIG — code below, knobs above ═══════════════ */
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════════════════════════════ */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const TAU=Math.PI*2;
/* Deterministic hash → [0,1). Used to procedurally generate unlock styles,
   milestone titles etc. so they're stable across sessions with no data. */
function hash01(n){let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const $=id=>document.getElementById(id);

/* ═══════════════════════════════════════════════════════════════════════
   SAVE / LOAD — everything persists in one localStorage JSON blob.
   ═══════════════════════════════════════════════════════════════════════ */
const DEFAULT_SAVE={
  v:1,
  level:1, xpInLevel:0,        // current level + progress into it
  lifetimeXP:0,                // never resets (drives unlocks)
  rebirths:0,                  // permanent XP multiplier count
  best:0, lastRun:0,
  runsPlayed:0, ringsTotal:0, perfectsTotal:0,
  deaths:0,                    // interstitial cadence counter
  streak:0, lastDay:"",        // daily streak
  missions:[],                 // active missions (see Missions)
  missionSeed:1,               // monotonically increasing mission generator seed
  coins:0,                     // spendable currency (earned per run)
  /* item 0 of every category is free & pre-owned */
  owned:{trail:[0],skin:[0],bg:[0],sound:[0],fx:[0]},
  equip:{trail:0,skin:0,bg:0,sound:0,fx:0},
  shopSeen:{trail:1,skin:1,bg:1,sound:1,fx:1}, // per-category count seen → NEW badges
  muted:false, lowFX:false,
  consentDone:false,
};
const SHOP_CATS=["trail","skin","bg","sound","fx"];
let S=loadSave();
function loadSave(){
  try{
    const raw=localStorage.getItem(CONFIG.SAVE_KEY);
    if(!raw) return structuredClone(DEFAULT_SAVE);
    // Merge over defaults so adding fields in updates never breaks old saves.
    const s=Object.assign(structuredClone(DEFAULT_SAVE), JSON.parse(raw));
    // nested objects need their own merge (a shallow assign would drop
    // newly added categories like sound/fx from pre-shop saves)
    for(const k of ["owned","equip","shopSeen"])
      s[k]=Object.assign(structuredClone(DEFAULT_SAVE[k]), s[k]||{});
    // never leave an un-owned item equipped
    for(const c of SHOP_CATS) if(!s.owned[c].includes(s.equip[c])) s.equip[c]=0;
    return s;
  }catch(e){ console.warn("[save] corrupt, resetting", e); return structuredClone(DEFAULT_SAVE); }
}
let saveQueued=false;
function save(){ // micro-batched: many systems call save(); write once per frame
  if(saveQueued) return; saveQueued=true;
  setTimeout(()=>{ saveQueued=false;
    try{ localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(S)); }
    catch(e){ console.warn("[save] write failed", e); }
  },0);
}

/* XP cost of a given level — endless curve, never plateaus. */
const xpForLevel=l=>Math.round(CONFIG.BASE_XP*Math.pow(l,CONFIG.XP_LEVEL_EXPONENT));
/* Total permanent XP-gain multiplier (rebirth + streak). */
function xpMult(){
  const streakBonus=Math.min(CONFIG.STREAK_BONUS_CAP, S.streak*CONFIG.STREAK_BONUS_PER_DAY);
  return (1+S.rebirths*CONFIG.REBIRTH_MULT_GAIN)*(1+streakBonus);
}

/* ═══════════════════════════════════════════════════════════════════════
   AUDIO — 100% procedural Web Audio, no files. Context is created lazily
   on the first user gesture (mobile autoplay policy), suspended on pause.
   ═══════════════════════════════════════════════════════════════════════ */
const Audio2={
  ctx:null, master:null,
  ensure(){
    if(S.muted) return null;
    if(!this.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      this.ctx=new AC();
      this.master=this.ctx.createGain();
      this.master.gain.value=0.5;
      this.master.connect(this.ctx.destination);
    }
    if(this.ctx.state==="suspended") this.ctx.resume();
    return this.ctx;
  },
  suspend(){ if(this.ctx&&this.ctx.state==="running") this.ctx.suspend(); },
  /* one-shot helper: oscillator with pitch+gain envelopes */
  blip(freq0,freq1,dur,type,vol,when=0){
    const ctx=this.ensure(); if(!ctx) return;
    const t=ctx.currentTime+when;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(freq1,1),t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur,vol,cutoff,when=0){
    const ctx=this.ensure(); if(!ctx) return;
    const t=ctx.currentTime+when;
    const n=Math.floor(ctx.sampleRate*dur);
    const buf=ctx.createBuffer(1,n,ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cutoff;
    const g=ctx.createGain(); g.gain.value=vol;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t);
  },
  /* equipped sound pack (see soundItem) drives the pluck/thunk voice */
  pack(){ return soundItem(S.equip.sound); },
  /* landed in a ring — weighty "thunk", pitched by the pack */
  thunk(){
    const p=this.pack();
    this.noise(0.08,0.5,900);
    this.blip(150*(p.base/523),60,0.12,"sine",0.5);
  },
  /* PERFECT — pluck that climbs the pack's scale with the combo:
     the escalating-audio dopamine ramp. */
  perfect(combo,packOverride){
    const p=packOverride||this.pack();
    const st=p.scale[Math.min(combo-1,p.scale.length-1)];
    const f=p.base*Math.pow(2,st/12);
    this.blip(f,f,0.16,p.wave,0.5);
    this.blip(f*2,f*2,0.10,"sine",0.22,0.02);      // sparkle octave
    if(combo>=3) this.blip(f*1.5,f*1.5,0.12,"sine",0.18,0.05);
  },
  /* shop preview: a short 3-note run in pack i's voice */
  preview(i){ const p=soundItem(i); this.perfect(1,p); setTimeout(()=>this.perfect(2,p),100); setTimeout(()=>this.perfect(3,p),200); },
  miss(){ this.blip(300,55,0.4,"sawtooth",0.35); this.noise(0.25,0.3,500,0.05); },
  levelup(){ [0,4,7,12].forEach((st,i)=>this.blip(440*Math.pow(2,st/12),440*Math.pow(2,st/12),0.18,"triangle",0.4,i*0.07)); },
  unlock(){ [0,5,9,12,16].forEach((st,i)=>this.blip(523*Math.pow(2,st/12),523*Math.pow(2,st/12),0.15,"square",0.15,i*0.06)); },
  ui(){ this.blip(700,900,0.05,"sine",0.15); },
  release(){ this.blip(220,700,0.09,"sine",0.25); },
};

/* ═══════════════════════════════════════════════════════════════════════
   HAPTICS — Capacitor Haptics when native, navigator.vibrate fallback,
   silent no-op in a desktop browser.
   ═══════════════════════════════════════════════════════════════════════ */
const Haptics={
  plugin(){ return window.Capacitor?.Plugins?.Haptics || null; },
  tap(){    const p=this.plugin(); if(p) p.impact({style:"LIGHT"}).catch(()=>{}); else navigator.vibrate?.(10); },
  hit(){    const p=this.plugin(); if(p) p.impact({style:"MEDIUM"}).catch(()=>{}); else navigator.vibrate?.(20); },
  perfect(){const p=this.plugin(); if(p) p.notification({type:"SUCCESS"}).catch(()=>{}); else navigator.vibrate?.([15,30,15]); },
  death(){  const p=this.plugin(); if(p) p.vibrate({duration:120}).catch(()=>{}); else navigator.vibrate?.(120); },
};

/* Keep the screen on during a run; let it sleep in menus. */
const Awake={
  p(){ return window.Capacitor?.Plugins?.KeepAwake || null; },
  on(){ this.p()?.keepAwake().catch(()=>{}); },
  off(){ this.p()?.allowSleep().catch(()=>{}); },
};
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   UNLOCKS — hand-authored classics first, then procedurally generated
   forever (golden-angle hues + word-list names), so unlocks never dry up.
   Everything is derived from the index → nothing to store but thresholds.
   ═══════════════════════════════════════════════════════════════════════ */
const WORDS_A=["Neon","Void","Solar","Ember","Frost","Quantum","Retro","Hyper","Lunar","Astro","Plasma","Crystal","Turbo","Phantom","Aurora","Cosmic"];
const WORDS_B=["Drift","Pulse","Flare","Echo","Storm","Bloom","Shard","Wave","Core","Halo","Spark","Trail","Rush","Glow","Orbit","Shift"];
function procName(i){ return WORDS_A[Math.floor(hash01(i*3+1)*WORDS_A.length)]+" "+WORDS_B[Math.floor(hash01(i*7+2)*WORDS_B.length)]; }
function procHue(i){ return Math.round(i*137.508)%360; }   // golden angle → well-spread hues

const HAND_TRAILS=[
  {name:"Mint",     c:"#5ef2c8"}, {name:"Sunset",  c:"#ff5e8a"},
  {name:"Sky",      c:"#38b6ff"}, {name:"Gold",    c:"#ffc94d"},
  {name:"Violet",   c:"#a78bfa"}, {name:"Lime",    c:"#a3e635"},
  {name:"Coral",    c:"#fb7185"}, {name:"Ice",     c:"#e0f2fe"},
];
const SKIN_SHAPES=["dot","ring","square","diamond","comet","star","eye","tri"];
const HAND_SKINS=[
  {name:"Classic", shape:"dot",    c:"#ffffff"}, {name:"Halo",   shape:"ring",   c:"#5ef2c8"},
  {name:"Cube",    shape:"square", c:"#ffc94d"}, {name:"Gem",    shape:"diamond",c:"#38b6ff"},
  {name:"Comet",   shape:"comet",  c:"#ff5e8a"}, {name:"Star",   shape:"star",   c:"#fff59d"},
  {name:"Watcher", shape:"eye",    c:"#a78bfa"}, {name:"Dart",   shape:"tri",    c:"#a3e635"},
];
const HAND_BGS=[
  {name:"Deep Space", top:"#0b0d1a", bot:"#141a3a"}, {name:"Nebula",  top:"#170b2a", bot:"#341b52"},
  {name:"Abyss",      top:"#04141c", bot:"#0b3040"}, {name:"Ember",   top:"#1c0b0b", bot:"#43152b"},
  {name:"Forest",     top:"#071a12", bot:"#12402a"}, {name:"Storm",   top:"#0d1220", bot:"#26324f"},
  {name:"Rosé",       top:"#1c0b18", bot:"#4a1c3a"}, {name:"Aurum",   top:"#141003", bot:"#3c2c08"},
];
/* Item i of a category — hand-authored if available, else generated. */
function trailItem(i){
  if(i<HAND_TRAILS.length) return HAND_TRAILS[i];
  return {name:procName(i), c:`hsl(${procHue(i)} 90% 65%)`};
}
function skinItem(i){
  if(i<HAND_SKINS.length) return HAND_SKINS[i];
  return {name:procName(i+50), shape:SKIN_SHAPES[i%SKIN_SHAPES.length], c:`hsl(${procHue(i+9)} 85% 70%)`};
}
function bgItem(i){
  if(i<HAND_BGS.length) return HAND_BGS[i];
  const h=procHue(i+17);
  return {name:procName(i+99), top:`hsl(${h} 45% 7%)`, bot:`hsl(${(h+40)%360} 55% 18%)`};
}
/* ── sound packs: swap the pluck/thunk voice. Hand-authored, then
      procedural (wave/base/scale derived from the index) forever. ───── */
const HAND_SOUNDS=[
  {name:"Classic", wave:"triangle", base:523, scale:[0,3,5,7,10,12,15,17]},   // minor pentatonic
  {name:"8-Bit",   wave:"square",   base:440, scale:[0,4,7,12,16,19,24,28]},  // major arps
  {name:"Laser",   wave:"sawtooth", base:392, scale:[0,2,7,9,14,16,21,23]},   // sus2 stacks
  {name:"Glass",   wave:"sine",     base:784, scale:[0,4,6,11,12,16,18,23]},  // lydian shimmer
];
const WAVES=["triangle","square","sawtooth","sine"];
function soundItem(i){
  if(i<HAND_SOUNDS.length) return HAND_SOUNDS[i];
  return {name:procName(i+201), wave:WAVES[i%WAVES.length],
    base:Math.round(330*Math.pow(2,hash01(i*11+4)*1.2)),
    scale:HAND_SOUNDS[Math.floor(hash01(i*5+9)*HAND_SOUNDS.length)].scale};
}
/* ── FX packs: perfect-hit explosion variants (see Particles.perfectFX).
      Hand-authored styles, then procedural style+hue recombinations. ── */
const HAND_FX=[
  {name:"Shatter",  style:"shatter"},
  {name:"Nova",     style:"nova"},
  {name:"Implode",  style:"implode"},
  {name:"Confetti", style:"confetti"},
  {name:"Quake",    style:"quake"},
];
function fxItem(i){
  if(i<HAND_FX.length) return HAND_FX[i];
  return {name:procName(i+301), style:HAND_FX[i%HAND_FX.length].style, hue:procHue(i+23)};
}
const CAT_ITEM={trail:trailItem,skin:skinItem,bg:bgItem,sound:soundItem,fx:fxItem};

/* Lifetime-XP threshold of the i-th unlock in any category (i=0 free). */
function unlockCost(i){ return i===0?0:Math.round(CONFIG.UNLOCK_BASE*Math.pow(i,CONFIG.UNLOCK_EXPONENT)); }
/* Coin price of the i-th shop item — tier-scaled, endless. XP makes an
   item AVAILABLE (unlockCost), coins BUY it (hybrid model). */
function coinPrice(i){ return i===0?0:Math.round(CONFIG.COIN_PRICE_BASE*Math.pow(i,CONFIG.COIN_PRICE_EXPONENT)/5)*5; }
function unlockedCount(){ // how many items per category current lifetime XP grants
  let i=0; while(unlockCost(i+1)<=S.lifetimeXP && i<9999) i++;
  return i+1;
}
/* Detect newly crossed thresholds after an XP gain → NEW UNLOCK banner. */
function checkNewUnlocks(prevLifetime){
  let iPrev=0; while(unlockCost(iPrev+1)<=prevLifetime) iPrev++;
  let iNow=0;  while(unlockCost(iNow+1)<=S.lifetimeXP)  iNow++;
  for(let i=iPrev+1;i<=iNow;i++){
    UI.toast(`✦ NEW IN SHOP — ${trailItem(i).name} tier available!`, true);
    Audio2.unlock(); Haptics.perfect();
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   MISSIONS — 3 active, procedurally generated & scaled to the player,
   refresh automatically when completed. Progress survives restarts.
   ═══════════════════════════════════════════════════════════════════════ */
const Missions={
  TYPES:["score","perfectRow","rings","runs","level","rebirth"],
  gen(seed){
    const lvl=S.level, t=this.TYPES[Math.floor(hash01(seed*13+5)*this.TYPES.length)];
    const r=hash01(seed*29+11);
    switch(t){
      case "score":      { const n=Math.max(5, Math.round((S.best||5)*(0.6+r*0.8))); return {t,n,p:0,txt:`Score ${n} in one run`,xp:n*15}; }
      case "perfectRow": { const n=3+Math.floor(r*3)+Math.floor(lvl/20); return {t,n,p:0,txt:`${n} PERFECTs in a row`,xp:n*60}; }
      case "rings":      { const n=30+Math.floor(r*40)+lvl*2; return {t,n,p:0,txt:`Pass ${n} rings (total)`,xp:n*6}; }
      case "runs":       { const n=3+Math.floor(r*5); return {t,n,p:0,txt:`Play ${n} runs`,xp:n*40}; }
      case "level":      { const n=lvl+1+Math.floor(r*3); return {t,n,p:0,txt:`Reach level ${n}`,xp:n*30}; }
      case "rebirth":    { return {t,n:S.rebirths+1,p:0,txt:`Rebirth ${S.rebirths?"again":"once"}`,xp:1500}; }
    }
  },
  ensure(){
    while(S.missions.length<3){
      // level-gate the rebirth mission so new players don't see it
      let m=this.gen(S.missionSeed++);
      if(m.t==="rebirth"&&S.level<CONFIG.REBIRTH_LEVEL*0.6) m=this.gen(S.missionSeed++);
      S.missions.push(m);
    }
    save();
  },
  /* event: {score?, perfectRow?, ring?, run?, level?, rebirth?} */
  progress(ev){
    let changed=false;
    for(const m of S.missions){
      const before=m.p;
      if(m.t==="score"&&ev.score!==undefined)           m.p=Math.max(m.p,ev.score);
      if(m.t==="perfectRow"&&ev.perfectRow!==undefined) m.p=Math.max(m.p,ev.perfectRow);
      if(m.t==="rings"&&ev.ring)                        m.p+=1;
      if(m.t==="runs"&&ev.run)                          m.p+=1;
      if(m.t==="level"&&ev.level!==undefined)           m.p=Math.max(m.p,ev.level);
      if(m.t==="rebirth"&&ev.rebirth!==undefined)       m.p=Math.max(m.p,ev.rebirth);
      if(m.p!==before) changed=true;
    }
    // complete & replace
    for(let i=S.missions.length-1;i>=0;i--){
      const m=S.missions[i];
      if(m.p>=m.n){
        S.missions.splice(i,1);
        UI.toast(`✔ MISSION — ${m.txt} · +${m.xp} XP`, true);
        Audio2.unlock();
        Progress.gainXP(m.xp, true); // mission XP skips run multipliers
        changed=true;
      }
    }
    if(changed){ this.ensure(); UI.renderMissions(); save(); }
  },
};

/* ═══════════════════════════════════════════════════════════════════════
   PARTICLES — fixed-size pool, zero allocation per frame. Two kinds:
   0 = spark (filled circle), 1 = shard (ring fragment arc, for the
   ring-shatter effect on PERFECT hits).
   ═══════════════════════════════════════════════════════════════════════ */
const Particles={
  pool:[], n:0,
  init(){
    for(let i=0;i<CONFIG.PARTICLE_POOL;i++)
      this.pool.push({on:false,kind:0,x:0,y:0,vx:0,vy:0,life:0,maxLife:1,size:2,rot:0,vr:0,arc:0,r:0,color:"#fff"});
  },
  spawn(kind,x,y,vx,vy,life,size,color,r=0,arc=0){
    for(let i=0;i<this.pool.length;i++){
      const p=this.pool[i];
      if(!p.on){
        p.on=true;p.kind=kind;p.x=x;p.y=y;p.vx=vx;p.vy=vy;
        p.life=life;p.maxLife=life;p.size=size;p.color=color;
        p.r=r;p.arc=arc;p.rot=rand(0,TAU);p.vr=rand(-4,4);
        return;
      }
    }
  },
  burst(x,y,color,n,speed){
    const count=Game.lowFX()?Math.ceil(n/2):n;
    for(let i=0;i<count;i++){
      const a=rand(0,TAU), s=rand(speed*0.3,speed);
      this.spawn(0,x,y,Math.cos(a)*s,Math.sin(a)*s,rand(0.3,0.7),rand(1.5,3.5),color);
    }
  },
  /* ring explodes into arc fragments that fly outward, spinning */
  shatter(x,y,r,color){
    const frags=Game.lowFX()?5:9;
    for(let i=0;i<frags;i++){
      const a=(i/frags)*TAU;
      this.spawn(1,x+Math.cos(a)*r,y+Math.sin(a)*r,
        Math.cos(a)*rand(60,160),Math.sin(a)*rand(60,160),
        rand(0.4,0.8),3,color,r*0.35,TAU/frags*0.8);
    }
  },
  /* perfect-hit effect, dispatched by the equipped FX pack (shop item).
     All variants reuse the same pool — no new allocation paths. */
  perfectFX(x,y,r,color,fxOverride){
    const fx=fxOverride??fxItem(S.equip.fx);
    const c=fx.hue!==undefined?`hsl(${fx.hue} 90% 65%)`:color;
    switch(fx.style){
      case "nova":       // two concentric spark waves
        for(let i=0;i<(Game.lowFX()?8:14);i++){
          const a=i/14*TAU;
          this.spawn(0,x,y,Math.cos(a)*220,Math.sin(a)*220,0.5,3,c);
          this.spawn(0,x,y,Math.cos(a+0.2)*120,Math.sin(a+0.2)*120,0.7,2,"#ffffff");
        }
        break;
      case "implode":    // sparks collapse into the ring center
        for(let i=0;i<(Game.lowFX()?8:14);i++){
          const a=rand(0,TAU), d=r*rand(1.6,2.4);
          this.spawn(0,x+Math.cos(a)*d,y+Math.sin(a)*d,-Math.cos(a)*d*2.2,-Math.sin(a)*d*2.2,0.45,2.5,c);
        }
        break;
      case "confetti":   // multicolor scatter
        for(let i=0;i<(Game.lowFX()?9:16);i++){
          const a=rand(0,TAU), s=rand(70,240);
          this.spawn(0,x,y,Math.cos(a)*s,Math.sin(a)*s,rand(0.4,0.8),rand(2,4),`hsl(${rand(0,360)} 90% 65%)`);
        }
        break;
      case "quake":      // shatter + heavy shake + white flash sparks
        this.shatter(x,y,r,c);
        this.burst(x,y,"#ffffff",10,260);
        Game.fx.shake=Math.max(Game.fx.shake,0.9);
        break;
      default:           // "shatter" — the classic
        this.shatter(x,y,r,c);
    }
  },
  update(dt){
    for(let i=0;i<this.pool.length;i++){
      const p=this.pool[i];
      if(!p.on) continue;
      p.life-=dt;
      if(p.life<=0){p.on=false;continue;}
      p.x+=p.vx*dt; p.y+=p.vy*dt;
      p.vx*=0.985; p.vy*=0.985;
      p.rot+=p.vr*dt;
    }
  },
  draw(ctx,camY){
    for(let i=0;i<this.pool.length;i++){
      const p=this.pool[i];
      if(!p.on) continue;
      const a=p.life/p.maxLife;
      ctx.globalAlpha=a;
      if(p.kind===0){
        ctx.fillStyle=p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y-camY,p.size*a+0.5,0,TAU); ctx.fill();
      }else{
        ctx.strokeStyle=p.color; ctx.lineWidth=3*a+1;
        ctx.beginPath(); ctx.arc(p.x,p.y-camY,p.r,p.rot,p.rot+p.arc); ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
  },
};
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   PROGRESS — XP, endless levels, rebirth, streak, milestone celebrations.
   ═══════════════════════════════════════════════════════════════════════ */
const Progress={
  /* Grant XP. raw=true skips run multipliers (missions/daily bonuses). */
  gainXP(amount, raw=false){
    const gained=Math.round(raw?amount:amount*xpMult());
    if(gained<=0) return 0;
    const prevLifetime=S.lifetimeXP;
    S.lifetimeXP+=gained;
    S.xpInLevel+=gained;
    while(S.xpInLevel>=xpForLevel(S.level)){
      S.xpInLevel-=xpForLevel(S.level);
      S.level++;
      this.celebrateLevel(S.level);
      Missions.progress({level:S.level});
    }
    checkNewUnlocks(prevLifetime);
    save();
    return gained;
  },
  /* Level-up juice: DOM flash + rising number, canvas chromatic pulse,
     arpeggio, haptic. Milestones (10/25/100 multiples) get procedurally
     generated titles so they never run out. */
  celebrateLevel(lvl){
    Audio2.levelup(); Haptics.perfect();
    UI.levelFx(lvl);
    Game.fx.chroma=1;
    if(lvl%100===0)      { UI.toast(`⭐ ${this.milestoneTitle(lvl)} — LEVEL ${lvl}! ⭐`, true); Game.fx.shake=1; }
    else if(lvl%25===0)  { UI.toast(`✨ ${this.milestoneTitle(lvl)} — level ${lvl}!`, true); }
    else if(lvl%10===0)  { UI.toast(`${this.milestoneTitle(lvl)} — level ${lvl}`); }
    if(lvl>=CONFIG.REBIRTH_LEVEL) UI.refreshHome();
  },
  /* Procedural milestone titles: seeded from the level number, infinite. */
  milestoneTitle(lvl){
    const RANKS=["Pilot","Drifter","Voyager","Slingshot","Comet","Meteor","Pulsar","Quasar","Nova","Singularity"];
    return WORDS_A[Math.floor(hash01(lvl*31+7)*WORDS_A.length)]+" "+RANKS[Math.floor(hash01(lvl*17+3)*RANKS.length)];
  },
  /* Daily streak — called once at boot. */
  checkDaily(){
    const d=new Date();
    const today=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    if(S.lastDay===today) return;
    const y=new Date(d.getTime()-864e5);
    const yesterday=`${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;
    S.streak=(S.lastDay===yesterday)?S.streak+1:1;
    S.lastDay=today;
    const bonus=CONFIG.STREAK_DAILY_XP*Math.min(S.streak,10);
    UI.toast(`🔥 Day ${S.streak} streak — +${bonus} XP!`, S.streak>1);
    this.gainXP(bonus, true);
    save();
  },
  rebirthAvailable(){ return S.level>=CONFIG.REBIRTH_LEVEL; },
  /* Optional prestige reset: level/XP → 1, permanent multiplier up.
     Lifetime XP (and thus unlocks), best score, streak all KEPT. */
  rebirth(){
    if(!this.rebirthAvailable()) return;
    S.rebirths++; S.level=1; S.xpInLevel=0;
    Missions.progress({rebirth:S.rebirths});
    UI.toast(`🌀 REBIRTH ${S.rebirths} — permanent ×${(1+S.rebirths*CONFIG.REBIRTH_MULT_GAIN).toFixed(1)} XP!`, true);
    Audio2.unlock(); Haptics.perfect();
    save(); UI.refreshHome();
  },
};

/* ═══════════════════════════════════════════════════════════════════════
   GAME — core loop. World is in "virtual units": width is always
   CONFIG.VIRTUAL_W (480), height varies with aspect ratio. One finger,
   one verb: tap = release the orbiting dot.
   ═══════════════════════════════════════════════════════════════════════ */
const Game={
  canvas:null, ctx:null,
  dpr:1, scale:1, vw:480, vh:800,      // virtual view size
  safeTop:0, safeBottom:0,             // safe-area + banner, in virtual units
  state:"menu",                        // menu | playing | dying | over | paused
  camY:0,
  time:0, lastT:0, running:false,

  // run state
  score:0, combo:1, perfectRow:0, revived:false,  // revived = ad-continue used
  coinRevives:0, runPerfects:0,
  runXPGained:0, missMargin:null, flipsSeen:0,

  cur:null, next:null, prevRing:null,  // ring objects
  dot:{x:0,y:0,angle:0,dir:1,omega:2,orbR:80,orbRT:80,mode:"orbit",vx:0,vy:0,trail:[],minDist:1e9},
  dyingT:0,

  fx:{shake:0,chroma:0},
  stars:null,
  floats:[],                            // pooled floating texts

  lowFX(){ return S.lowFX; },

  init(){
    this.canvas=$("game");
    this.ctx=this.canvas.getContext("2d");
    for(let i=0;i<12;i++) this.floats.push({on:false,x:0,y:0,txt:"",life:0,maxLife:1,color:"#fff",size:16,world:true});
    this.resize();
    window.addEventListener("resize",()=>this.resize());
    // Input: pointerdown covers touch + mouse with zero delay
    // (touch-action:none in CSS suppresses browser gestures).
    this.canvas.addEventListener("pointerdown",e=>{e.preventDefault();this.onTap();},{passive:false});
    window.addEventListener("keydown",e=>{
      if(e.code==="Space"){e.preventDefault();this.onTap();}
      if(e.code==="Escape"&&this.state==="playing") UI.pause();
    });
    this.lastT=performance.now();
    requestAnimationFrame(t=>this.frame(t));
  },

  resize(){
    const cssW=window.innerWidth, cssH=window.innerHeight;
    // Cap DPR: cheap-GPU phones burn fill-rate fast; lowFX drops to 1.
    this.dpr=S.lowFX?1:Math.min(window.devicePixelRatio||1,CONFIG.DPR_CAP);
    this.canvas.width=Math.round(cssW*this.dpr);
    this.canvas.height=Math.round(cssH*this.dpr);
    this.scale=cssW/CONFIG.VIRTUAL_W;
    this.vw=CONFIG.VIRTUAL_W;
    this.vh=cssH/this.scale;
    // safe-area probes → virtual units, so the HUD clears notches & banner
    this.safeTop=($("probe-top").offsetHeight||0)/this.scale;
    this.safeBottom=($("probe-bottom").offsetHeight||0)/this.scale;
    this.buildStars();
  },
  buildStars(){
    // Static parallax starfield, generated once per resize (not per frame).
    this.stars=[];
    const n=this.lowFX()?36:80;
    for(let i=0;i<n;i++)
      this.stars.push({x:rand(0,this.vw),y:rand(0,this.vh*1.5),s:rand(0.5,1.8),a:rand(0.15,0.7),p:rand(0.15,0.45)});
  },

  /* ── difficulty: smooth continuous functions, clamped for playability.
        n = rings passed this run, L = player level. Works identically at
        level 3 and level 300 — no tiers, no special cases. ─────────── */
  orbitSpeed(n){ return clamp(CONFIG.ORBIT_SPEED_BASE + CONFIG.ORBIT_SPEED_GROWTH*n + CONFIG.ORBIT_SPEED_LEVEL*Math.sqrt(S.level), 0, CONFIG.ORBIT_SPEED_MAX); },
  targetR(n){    return clamp(CONFIG.TARGET_R_BASE - CONFIG.TARGET_R_SHRINK*Math.sqrt(n) - CONFIG.TARGET_R_LEVEL*Math.sqrt(S.level), CONFIG.TARGET_R_MIN, CONFIG.TARGET_R_BASE); },
  flipChance(n){ return n<CONFIG.FLIP_START_N?0:clamp((n-CONFIG.FLIP_START_N)*CONFIG.FLIP_CHANCE_GROWTH + S.level*CONFIG.FLIP_CHANCE_LEVEL, 0, CONFIG.FLIP_CHANCE_MAX); },
  moveAmp(n){    return n<CONFIG.MOVE_START_N?0:clamp((n-CONFIG.MOVE_START_N)*CONFIG.MOVE_AMP_GROWTH, 0, CONFIG.MOVE_AMP_MAX); },
  moveSpeed(n){  return clamp(CONFIG.MOVE_SPEED_BASE + n*0.02, 0, CONFIG.MOVE_SPEED_MAX); },

  makeRing(x,y,r,n){
    return {x,y,baseX:x,r,
      moveAmp:this.moveAmp(n),moveSpeed:this.moveSpeed(n),movePhase:rand(0,TAU),
      pulse:0};
  },
  spawnNext(){
    const n=this.score;
    const dist=rand(CONFIG.TARGET_DIST_MIN,CONFIG.TARGET_DIST_MAX);
    const cone=CONFIG.TARGET_CONE_DEG*Math.PI/180;
    let a=rand(-cone,cone);
    let x=this.cur.x+Math.sin(a)*dist;
    const margin=70;
    if(x<margin||x>this.vw-margin) { a=-a; x=this.cur.x+Math.sin(a)*dist; }
    x=clamp(x,margin,this.vw-margin);
    const y=this.cur.y-Math.cos(a)*dist;
    this.next=this.makeRing(x,y,this.targetR(n),n);
  },

  startRun(){
    this.state="playing";
    this.score=0; this.combo=1; this.perfectRow=0; this.revived=false;
    this.coinRevives=0; this.runPerfects=0;
    this.runXPGained=0; this.missMargin=null;
    this.cur=this.makeRing(this.vw/2, 0, CONFIG.TARGET_R_BASE, 0);
    this.camY=this.cur.y-this.vh*0.62;
    this.prevRing=null;
    this.spawnNext();
    const d=this.dot;
    d.mode="orbit"; d.dir=1; d.angle=Math.PI/2; d.omega=this.orbitSpeed(0);
    d.orbR=d.orbRT=this.cur.r+CONFIG.ORBIT_GAP; d.trail.length=0; d.minDist=1e9;
    for(const f of this.floats) f.on=false;
    Awake.on();
    UI.showScreen(null);
    $("btn-pause").style.display="block";
  },

  onTap(){
    if(this.state!=="playing") return;
    const d=this.dot;
    if(d.mode!=="orbit") return;
    // Release: fly along the orbit tangent.
    const tx=-Math.sin(d.angle)*d.dir, ty=Math.cos(d.angle)*d.dir;
    d.vx=tx*CONFIG.FLY_SPEED; d.vy=ty*CONFIG.FLY_SPEED;
    d.mode="fly"; d.minDist=1e9;
    Audio2.release(); Haptics.tap();
  },

  /* dot captured by `next` ring; perp = straight-line closest-approach
     distance to the ring's center → hit quality + near-miss feedback. */
  capture(perp){
    const ring=this.next;
    const perfect=perp<=ring.r*CONFIG.PERFECT_FRACTION;
    let points;
    if(perfect){
      this.combo=Math.min(this.combo+1,CONFIG.COMBO_MAX);
      this.perfectRow++; this.runPerfects++;
      points=this.combo;
      Audio2.perfect(this.combo); Haptics.perfect();
      Particles.perfectFX(ring.x,ring.y,ring.r,UI.trailColor());
      this.fx.shake=Math.max(this.fx.shake,0.5+this.combo*0.06);
      this.float(ring.x,ring.y-ring.r-16,`PERFECT ×${this.combo}`,UI.trailColor(),20);
    }else{
      this.combo=1; this.perfectRow=0; points=1;
      Audio2.thunk(); Haptics.hit();
      Particles.burst(this.dot.x,this.dot.y,"#ffffff",10,140);
      this.fx.shake=Math.max(this.fx.shake,0.25);
      const edgePx=Math.round(ring.r-perp);
      this.float(ring.x,ring.y-ring.r-16,edgePx<8?`clipped it! +1`:`+1`,"#c9d2ff",15);
    }
    this.score+=points;
    // live XP so level-ups can pop mid-run
    this.runXPGained+=Progress.gainXP(points*CONFIG.XP_PER_POINT);
    Missions.progress({ring:true,score:this.score,perfectRow:this.perfectRow});
    this.checkScoreMilestone();

    // promote rings
    ring.pulse=1;
    this.prevRing=this.cur; this.prevRingFade=1;
    this.cur=ring;
    this.spawnNext();

    // dot latches on: orbit from its capture position, radius eases out
    const d=this.dot;
    d.mode="orbit";
    d.angle=Math.atan2(d.y-ring.y,d.x-ring.x);
    d.orbR=Math.max(Math.hypot(d.x-ring.x,d.y-ring.y),ring.r*0.3);
    d.orbRT=ring.r+CONFIG.ORBIT_GAP;
    d.omega=this.orbitSpeed(this.score);
    // random rotation flip — the trap that keeps veterans honest
    if(Math.random()<this.flipChance(this.score)){
      d.dir*=-1; this.flipsSeen++;
      this.float(ring.x,ring.y,d.dir>0?"⟳ FLIP":"⟲ FLIP","#ffc94d",17);
      Audio2.blip(500,300,0.12,"square",0.2);
    }
  },

  /* score milestones: 5,10,25,50,75,100 then every 50 — always a visible
     next target, procedurally infinite. */
  nextMilestone(s){
    const seq=[5,10,25,50,75,100];
    for(const m of seq) if(s<m) return m;
    return (Math.floor(s/50)+1)*50;
  },
  checkScoreMilestone(){
    const before=this.nextMilestone(this.score-1), after=this.nextMilestone(this.score);
    if(after!==before){ // crossed `before`
      this.float(this.cur.x,this.cur.y-60,`— ${before} —`,"#5ef2c8",22);
      Particles.burst(this.cur.x,this.cur.y,"#5ef2c8",16,200);
      Audio2.blip(660,990,0.15,"triangle",0.3);
    }
  },

  die(margin){
    this.state="dying"; this.dyingT=0;
    this.missMargin=margin;
    Audio2.miss(); Haptics.death();
    this.fx.shake=1;
    Particles.burst(this.dot.x,this.dot.y,"#ff5e8a",22,240);
  },
  /* price of the NEXT coin revive this run — escalates so it can't be
     spammed; resets every run. */
  nextRevivePrice(){
    return Math.round(CONFIG.REVIVE_COIN_BASE*Math.pow(CONFIG.REVIVE_COIN_GROWTH,this.coinRevives));
  },
  /* coin-revive path: same continue as the rewarded ad, paid in coins.
     Resolves the revive gate → a pending interstitial is cancelled. */
  coinRevive(){
    if(this.state!=="over") return;
    const price=this.nextRevivePrice();
    if(S.coins<price) return;
    S.coins-=price; this.coinRevives++; save();
    Ads.interstitialPending=false;      // revive taken — interstitial loses
    UI.toast(`🪙 −${price} — RUN CONTINUES!`,true);
    Audio2.unlock(); Haptics.perfect();
    this.revive();
  },
  /* revive core (rewarded ad or coins): back in orbit around the launch
     ring, score kept. `revived` flags only the once-per-run AD continue. */
  revive(fromAd){
    if(fromAd) this.revived=true;
    const d=this.dot, ring=this.cur;
    d.mode="orbit";
    d.angle=rand(0,TAU); d.orbR=d.orbRT=ring.r+CONFIG.ORBIT_GAP;
    d.minDist=1e9; d.trail.length=0;
    this.state="playing";
    UI.showScreen(null);
    $("btn-pause").style.display="block";
    Awake.on();
  },

  float(x,y,txt,color,size){
    for(const f of this.floats){
      if(!f.on){f.on=true;f.x=x;f.y=y;f.txt=txt;f.color=color;f.size=size;f.life=f.maxLife=1.1;return;}
    }
  },

  /* ── main loop ──────────────────────────────────────────────────── */
  frame(t){
    requestAnimationFrame(tt=>this.frame(tt));
    let dt=(t-this.lastT)/1000; this.lastT=t;
    if(dt>0.1) dt=0.1;                     // tab-switch spike guard
    if(this.state==="paused") return;      // loop halted while paused
    this.time+=dt;
    this.update(dt);
    this.render();
  },

  update(dt){
    const playing=this.state==="playing"||this.state==="dying";
    Particles.update(dt);
    if(this.fx.shake>0) this.fx.shake=Math.max(0,this.fx.shake-dt*2.4);
    if(this.fx.chroma>0) this.fx.chroma=Math.max(0,this.fx.chroma-dt*1.6);
    for(const f of this.floats){ if(f.on){ f.life-=dt; f.y-=26*dt; if(f.life<=0) f.on=false; } }
    if(this.prevRing&&this.prevRingFade>0) this.prevRingFade=Math.max(0,this.prevRingFade-dt*1.4);
    if(!playing){
      // menu: idle world drift so the background feels alive
      this.camY-=dt*6;
      return;
    }

    const d=this.dot;
    // moving targets oscillate horizontally (smooth, clamped amplitude)
    for(const ring of [this.cur,this.next]){
      if(ring&&ring.moveAmp>0) ring.x=ring.baseX+Math.sin(this.time*ring.moveSpeed+ring.movePhase)*ring.moveAmp;
      if(ring&&ring.pulse>0) ring.pulse=Math.max(0,ring.pulse-dt*2.5);
    }

    if(this.state==="dying"){
      const sdt=dt*0.35;                   // slow-mo death for readability
      d.x+=d.vx*sdt; d.y+=d.vy*sdt;
      this.dyingT+=dt;
      if(this.dyingT>=CONFIG.DEATH_SLOWMO_S) UI.gameOver();
      return;
    }

    if(d.mode==="orbit"){
      d.orbR=lerp(d.orbR,d.orbRT,1-Math.exp(-dt*10)); // ease onto orbit radius
      d.angle+=d.dir*d.omega*dt;
      d.x=this.cur.x+Math.cos(d.angle)*d.orbR;
      d.y=this.cur.y+Math.sin(d.angle)*d.orbR;
    }else{ // fly
      const px=d.x,py=d.y;
      d.x+=d.vx*dt; d.y+=d.vy*dt;
      const ring=this.next;
      // segment-based checks → no tunneling even on a lagging frame
      const distNow=Math.hypot(d.x-ring.x,d.y-ring.y);
      d.minDist=Math.min(d.minDist,segPointDist(px,py,d.x,d.y,ring.x,ring.y));
      if(distNow<=ring.r){
        // perpendicular (closest-approach) distance of the flight line —
        // this is the "how centered was that" metric
        const vlen=Math.hypot(d.vx,d.vy);
        const perp=Math.abs(((ring.x-d.x)*d.vy-(ring.y-d.y)*d.vx)/vlen);
        this.capture(Math.min(perp,d.minDist));
      }else{
        const movingAway=((ring.x-d.x)*d.vx+(ring.y-d.y)*d.vy)<0;
        const off=d.x<-40||d.x>this.vw+40||d.y-this.camY>this.vh+80||d.y-this.camY<-120;
        if((movingAway&&distNow>ring.r+10)||off){
          this.die(Math.max(0,d.minDist-ring.r));
        }
      }
      // trail: short ring buffer of previous positions
      d.trail.push(d.x,d.y);
      if(d.trail.length>26) d.trail.splice(0,2);
    }

    // camera eases so current ring rests ~62% down the screen
    const targetCam=this.cur.y-this.vh*0.62;
    this.camY=lerp(this.camY,targetCam,1-Math.exp(-dt*4));
  },
};
/* point-to-segment distance (capture & near-miss math) */
function segPointDist(ax,ay,bx,by,cx,cy){
  const dx=bx-ax,dy=by-ay;
  const L2=dx*dx+dy*dy;
  if(L2===0) return Math.hypot(cx-ax,cy-ay);
  let t=((cx-ax)*dx+(cy-ay)*dy)/L2;
  t=clamp(t,0,1);
  return Math.hypot(cx-(ax+dx*t),cy-(ay+dy*t));
}
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   RENDER — one canvas pass per frame. All drawing in virtual units via a
   single setTransform; minimal state changes, zero per-frame allocation.
   ═══════════════════════════════════════════════════════════════════════ */
Game.render=function(){
  const ctx=this.ctx, vw=this.vw, vh=this.vh;
  const k=this.scale*this.dpr;

  // screen shake (skipped in low-FX mode)
  let shx=0,shy=0;
  if(this.fx.shake>0&&!this.lowFX()){
    const s=this.fx.shake*CONFIG.SHAKE_MAX;
    shx=rand(-s,s); shy=rand(-s,s);
  }
  ctx.setTransform(k,0,0,k,shx*k,shy*k);

  // background gradient from the equipped "world"
  const bg=bgItem(S.equip.bg);
  const g=ctx.createLinearGradient(0,0,0,vh);
  g.addColorStop(0,bg.top); g.addColorStop(1,bg.bot);
  ctx.fillStyle=g; ctx.fillRect(-20,-20,vw+40,vh+40);

  // parallax starfield
  ctx.fillStyle="#ffffff";
  for(let i=0;i<this.stars.length;i++){
    const st=this.stars[i];
    let sy=(st.y-this.camY*st.p)%(vh*1.5); if(sy<0)sy+=vh*1.5;
    ctx.globalAlpha=st.a;
    ctx.fillRect(st.x,sy-vh*0.25,st.s,st.s);
  }
  ctx.globalAlpha=1;

  const cam=this.camY;
  const trailC=UI.trailColor();

  // fading previous ring
  if(this.prevRing&&this.prevRingFade>0){
    ctx.globalAlpha=this.prevRingFade*0.35;
    ctx.strokeStyle="#8b93b8"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(this.prevRing.x,this.prevRing.y-cam,this.prevRing.r,0,TAU); ctx.stroke();
    ctx.globalAlpha=1;
  }

  const inRun=this.state==="playing"||this.state==="dying";
  if(inRun){
    // current ring (the one we orbit)
    const c=this.cur;
    ctx.strokeStyle=trailC; ctx.lineWidth=4+c.pulse*5;
    ctx.globalAlpha=0.9;
    ctx.beginPath(); ctx.arc(c.x,c.y-cam,c.r+c.pulse*8,0,TAU); ctx.stroke();
    // faint orbit path
    ctx.globalAlpha=0.18; ctx.lineWidth=1.5; ctx.strokeStyle="#ffffff";
    ctx.beginPath(); ctx.arc(c.x,c.y-cam,this.dot.orbRT,0,TAU); ctx.stroke();
    ctx.globalAlpha=1;

    // target ring: outer + dashed inner "perfect zone" that breathes
    const n=this.next;
    const breathe=1+Math.sin(this.time*3)*0.04;
    ctx.strokeStyle="#ffffff"; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(n.x,n.y-cam,n.r,0,TAU); ctx.stroke();
    ctx.strokeStyle=trailC; ctx.globalAlpha=0.55; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(n.x,n.y-cam,n.r*CONFIG.PERFECT_FRACTION*breathe,0,TAU); ctx.stroke();
    ctx.globalAlpha=0.10; ctx.fillStyle=trailC;
    ctx.beginPath(); ctx.arc(n.x,n.y-cam,n.r,0,TAU); ctx.fill();
    ctx.globalAlpha=1;

    // dot trail (while flying) — cheap fading polyline
    const d=this.dot;
    if(d.mode==="fly"&&d.trail.length>=4&&!this.lowFX()){
      ctx.strokeStyle=trailC; ctx.lineCap="round";
      for(let i=0;i<d.trail.length-2;i+=2){
        const a=i/d.trail.length;
        ctx.globalAlpha=a*0.6; ctx.lineWidth=1+a*5;
        ctx.beginPath();
        ctx.moveTo(d.trail[i],d.trail[i+1]-cam);
        ctx.lineTo(d.trail[i+2],d.trail[i+3]-cam);
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }

    // aim hint while orbiting: tangent line showing launch direction.
    // Long at level 1 for onboarding, shrinks smoothly with level to a
    // floor (INDICATOR_LEN_BASE/MIN — independent of TARGET_R_MIN).
    if(d.mode==="orbit"){
      const len=clamp(CONFIG.INDICATOR_LEN_BASE-CONFIG.INDICATOR_SHRINK*Math.sqrt(Math.max(S.level-1,0)),
        CONFIG.INDICATOR_LEN_MIN,CONFIG.INDICATOR_LEN_BASE);
      const tx=-Math.sin(d.angle)*d.dir, ty=Math.cos(d.angle)*d.dir;
      ctx.strokeStyle="#ffffff"; ctx.globalAlpha=0.35; ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(d.x+tx*14,d.y-cam+ty*14);
      ctx.lineTo(d.x+tx*(14+len),d.y-cam+ty*(14+len));
      ctx.stroke();
      ctx.globalAlpha=1;
    }

    this.drawDot(ctx,d.x,d.y-cam,cam);
  }

  Particles.draw(ctx,cam);

  // floating texts (world-anchored)
  ctx.textAlign="center";
  for(const f of this.floats){
    if(!f.on) continue;
    ctx.globalAlpha=Math.min(1,f.life/f.maxLife*1.6);
    ctx.fillStyle=f.color;
    ctx.font=`800 ${f.size}px system-ui,sans-serif`;
    ctx.fillText(f.txt,f.x,f.y-cam);
  }
  ctx.globalAlpha=1;

  // chromatic pulse on level-up: expanding RGB-split rings from center
  if(this.fx.chroma>0&&!this.lowFX()){
    const p=1-this.fx.chroma;
    const r=p*vh*0.8+40;
    ctx.globalAlpha=this.fx.chroma*0.7; ctx.lineWidth=10*this.fx.chroma+2;
    ctx.strokeStyle="#ff004c"; ctx.beginPath(); ctx.arc(vw/2-4,vh/2,r,0,TAU); ctx.stroke();
    ctx.strokeStyle="#00e5ff"; ctx.beginPath(); ctx.arc(vw/2+4,vh/2,r*1.02,0,TAU); ctx.stroke();
    ctx.strokeStyle="#ffffff"; ctx.beginPath(); ctx.arc(vw/2,vh/2,r*1.01,0,TAU); ctx.stroke();
    ctx.globalAlpha=1;
  }

  if(inRun) this.drawHUD(ctx);
};

/* equipped skin renderer — shapes are procedural, no image assets */
Game.drawDot=function(ctx,x,y,cam){
  const skin=skinItem(S.equip.skin);
  const r=CONFIG.DOT_R;
  ctx.fillStyle=skin.c; ctx.strokeStyle=skin.c;
  switch(skin.shape){
    case "ring": ctx.lineWidth=3.5; ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.stroke(); break;
    case "square": ctx.save(); ctx.translate(x,y); ctx.rotate(this.time*2); ctx.fillRect(-r,-r,r*2,r*2); ctx.restore(); break;
    case "diamond": ctx.save(); ctx.translate(x,y); ctx.rotate(Math.PI/4+this.time); ctx.fillRect(-r*0.9,-r*0.9,r*1.8,r*1.8); ctx.restore(); break;
    case "comet": ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
      ctx.globalAlpha=0.4; ctx.beginPath(); ctx.arc(x,y,r*1.9,0,TAU); ctx.fill(); ctx.globalAlpha=1; break;
    case "star":{ ctx.save(); ctx.translate(x,y); ctx.rotate(this.time*1.5); ctx.beginPath();
      for(let i=0;i<10;i++){const rr=i%2?r*0.5:r*1.3, a=i/10*TAU; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}
      ctx.closePath(); ctx.fill(); ctx.restore(); break; }
    case "eye": ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
      ctx.fillStyle="#0b0d1a"; ctx.beginPath(); ctx.arc(x,y,r*0.45,0,TAU); ctx.fill(); break;
    case "tri": ctx.save(); ctx.translate(x,y);
      ctx.rotate(this.dot.mode==="fly"?Math.atan2(this.dot.vy,this.dot.vx)+Math.PI/2:this.dot.angle);
      ctx.beginPath(); ctx.moveTo(0,-r*1.3); ctx.lineTo(r,r); ctx.lineTo(-r,r); ctx.closePath(); ctx.fill(); ctx.restore(); break;
    default: ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill();
  }
};

/* in-run HUD: ghost progress bar, big score, combo, next milestone,
   level chip. All offset by safe-area + banner so nothing is obscured. */
Game.drawHUD=function(ctx){
  const vw=this.vw, top=this.safeTop, bot=this.vh-this.safeBottom;

  // ghost bar: this run vs best (plus last-run marker) — always visible
  const best=Math.max(S.best,1);
  const bw=vw*0.6, bx=(vw-bw)/2, by=top+14;
  ctx.fillStyle="#ffffff18"; ctx.fillRect(bx,by,bw,5);
  ctx.fillStyle="#5ef2c8aa"; ctx.fillRect(bx,by,bw*clamp(this.score/best,0,1),5);
  if(S.lastRun>0){
    ctx.fillStyle="#ff5e8a";
    ctx.fillRect(bx+bw*clamp(S.lastRun/best,0,1)-1.5,by-3,3,11);
  }
  ctx.fillStyle="#8b93b8"; ctx.font="700 10px system-ui,sans-serif";
  ctx.textAlign="left"; ctx.fillText("0",bx-12,by+6);
  ctx.textAlign="right"; ctx.fillText(`${S.best}`,bx+bw+26,by+6);

  // score + combo
  ctx.textAlign="center";
  ctx.fillStyle="#ffffff"; ctx.font="900 46px system-ui,sans-serif";
  ctx.fillText(`${this.score}`,vw/2,top+64);
  if(this.combo>1){
    const pulse=1+Math.sin(this.time*8)*0.08;
    ctx.fillStyle=UI.trailColor(); ctx.font=`900 ${Math.round(20*pulse)}px system-ui,sans-serif`;
    ctx.fillText(`COMBO ×${this.combo}`,vw/2,top+90);
  }else{
    ctx.fillStyle="#8b93b8"; ctx.font="700 12px system-ui,sans-serif";
    ctx.fillText(`next ▸ ${this.nextMilestone(this.score)}`,vw/2,top+86);
  }

  // level chip bottom-left with mini XP bar (clears banner via safeBottom)
  const need=xpForLevel(S.level);
  ctx.textAlign="left"; ctx.fillStyle="#c9d2ff"; ctx.font="800 13px system-ui,sans-serif";
  ctx.fillText(`LVL ${S.level}`,14,bot-22);
  ctx.fillStyle="#ffffff18"; ctx.fillRect(14,bot-16,90,4);
  ctx.fillStyle="#7aa2ff";  ctx.fillRect(14,bot-16,90*clamp(S.xpInLevel/need,0,1),4);
  if(S.rebirths>0){
    ctx.fillStyle="#a78bfa"; ctx.font="700 11px system-ui,sans-serif";
    ctx.fillText(`🌀×${(1+S.rebirths*CONFIG.REBIRTH_MULT_GAIN).toFixed(1)}`,112,bot-18);
  }
};
</script>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════
   UI — DOM screens, toasts, unlock browser, and screen flow.
   ═══════════════════════════════════════════════════════════════════════ */
const UI={
  curTab:"trail",
  pendingBuy:null, pendingBuyT:0,    // two-tap purchase state
  rebirthArmed:false, rebirthT:0,    // two-tap rebirth state
  trailColor(){ return trailItem(S.equip.trail).c; },

  init(){
    $("btn-play").addEventListener("click",()=>{ Audio2.ensure(); Audio2.ui(); Game.startRun(); });
    // Leaving the over screen = revive declined → a pending interstitial
    // (3rd-death cadence) may fire now, never earlier.
    $("btn-retry").addEventListener("click",()=>{ Ads.reviveDeclined(); Audio2.ui(); Game.startRun(); });
    $("btn-home").addEventListener("click",()=>{ Ads.reviveDeclined(); Audio2.ui(); this.home(); });
    $("btn-pause").addEventListener("click",()=>this.pause());
    $("btn-resume").addEventListener("click",()=>this.resume());
    $("btn-p-restart").addEventListener("click",()=>{ Audio2.ui(); Game.startRun(); });
    $("btn-p-home").addEventListener("click",()=>{ Audio2.ui(); this.home(); });
    $("btn-sound").addEventListener("click",()=>{
      S.muted=!S.muted; save(); this.refreshHome();
      if(S.muted) Audio2.suspend(); else { Audio2.ensure(); Audio2.ui(); }
    });
    $("btn-fx").addEventListener("click",()=>{
      S.lowFX=!S.lowFX; save(); Game.resize(); this.refreshHome(); Audio2.ui();
    });
    // Two-tap confirm — native confirm() dialogs are silently blocked in
    // sandboxed WebViews/previews, so no blocking dialogs anywhere.
    $("btn-rebirth").addEventListener("click",()=>{
      if(this.rebirthArmed){
        clearTimeout(this.rebirthT); this.rebirthArmed=false;
        Progress.rebirth(); return;
      }
      const mult=(1+(S.rebirths+1)*CONFIG.REBIRTH_MULT_GAIN).toFixed(1);
      this.rebirthArmed=true; Audio2.ui();
      $("btn-rebirth").textContent=`🌀 Reset to Lv1, keep unlocks, gain ×${mult} XP forever — tap again!`;
      this.rebirthT=setTimeout(()=>{ this.rebirthArmed=false; this.refreshHome(); },3500);
    });
    $("btn-unlocks").addEventListener("click",()=>{ Audio2.ui(); this.showScreen("unlocks"); this.renderUnlocks(); });
    $("btn-u-back").addEventListener("click",()=>{ Audio2.ui(); this.home(); });
    document.querySelectorAll("#unlocks .tabs button").forEach(b=>{
      b.addEventListener("click",()=>{
        this.curTab=b.dataset.tab; Audio2.ui();
        document.querySelectorAll("#unlocks .tabs button").forEach(x=>x.classList.toggle("on",x===b));
        this.renderUnlocks();
      });
    });
    $("btn-doublexp").addEventListener("click",()=>Ads.rewardDoubleXP());
    $("btn-continue").addEventListener("click",()=>Ads.rewardContinue());
    $("btn-coinrevive").addEventListener("click",()=>Game.coinRevive());
    $("btn-privacy").addEventListener("click",()=>Ads.showPrivacyOptions());
    this.applyScheme();
    this.refreshHome();
  },

  showScreen(name){ // null = none (in game)
    for(const id of ["start","over","pause","unlocks"])
      $(id).classList.toggle("hidden",id!==name);
    if(name!==null) $("btn-pause").style.display="none";
  },
  home(){
    Game.state="menu"; Awake.off();
    this.refreshHome(); this.showScreen("start");
  },
  refreshHome(){
    $("s-best").textContent=S.best;
    $("s-coins").textContent=S.coins;
    $("shop-dot").classList.toggle("hidden",!this.shopHasNew());
    $("s-streak").textContent=S.streak;
    $("s-rebirth").textContent=S.rebirths>0?`REBIRTH ×${(1+S.rebirths*CONFIG.REBIRTH_MULT_GAIN).toFixed(1)}`:"XP ×"+xpMult().toFixed(1);
    $("s-level").textContent=S.level;
    const need=xpForLevel(S.level);
    $("s-xptext").textContent=`${S.xpInLevel} / ${need} XP`;
    $("s-xpfill").style.width=`${clamp(S.xpInLevel/need*100,0,100)}%`;
    $("btn-sound").textContent=S.muted?"🔇":"🔊";
    $("btn-fx").textContent=S.lowFX?"✨ FX: LO":"✨ FX: HI";
    $("btn-rebirth").classList.toggle("hidden",!Progress.rebirthAvailable());
    if(!this.rebirthArmed) $("btn-rebirth").textContent="🌀 REBIRTH — permanent XP boost";
    this.renderMissions();
  },
  renderMissions(){
    const el=$("s-missions"); el.innerHTML="";
    for(const m of S.missions){
      const div=document.createElement("div");
      div.className="mission"+(m.p>=m.n?" done":"");
      div.innerHTML=`<span>🎯 ${m.txt}</span><span class="mprog">${Math.min(m.p,m.n)}/${m.n} · +${m.xp}xp</span>`;
      el.appendChild(div);
    }
  },

  pause(){
    if(Game.state!=="playing") return;
    Game.state="paused";
    Audio2.suspend(); Awake.off();
    this.showScreen("pause");
  },
  resume(){
    if(Game.state!=="paused") return;
    this.showScreen(null);
    $("btn-pause").style.display="block";
    Audio2.ensure(); Awake.on();
    Game.state="playing";
  },

  gameOver(){
    Game.state="over";
    Awake.off();
    const score=Game.score;
    const wasBest=score>S.best;
    // near-miss feedback: the "one more run" hook
    const m=Game.missMargin;
    $("o-miss").textContent =
      m!==null&&m<=CONFIG.NEAR_MISS_SHOW_PX ? `missed by ${Math.max(1,Math.round(m))}px — SO close` :
      m!==null ? `missed by ${Math.round(m)}px` : "";
    // ghost bar: this run vs best, marker = previous run
    const ref=Math.max(S.best,score,1);
    $("o-you").style.width=`${clamp(score/ref*100,0,100)}%`;
    $("o-mark").style.left=`${clamp(S.lastRun/ref*100,0,100)}%`;
    $("o-bestn").textContent=Math.max(S.best,score);
    $("o-newbest").classList.toggle("hidden",!wasBest);
    if(wasBest){ S.best=score; Audio2.unlock(); }
    $("o-score").textContent=score;
    $("o-xp").textContent=`+${Game.runXPGained} XP  (×${xpMult().toFixed(1)} bonus)`;
    // coin payout: score-scaled + a bonus per PERFECT landed
    const coinsEarned=Math.round(score*CONFIG.COINS_PER_SCORE)+Game.runPerfects*CONFIG.COINS_COMBO_BONUS;
    S.coins+=coinsEarned;
    $("o-coins").textContent=`+${coinsEarned} 🪙  ·  total ${S.coins}`;
    $("o-level").textContent=S.level;
    const need=xpForLevel(S.level);
    $("o-xptext").textContent=`${S.xpInLevel} / ${need} XP`;
    $("o-xpfill").style.width=`${clamp(S.xpInLevel/need*100,0,100)}%`;
    // revive paths (both resolve BEFORE any pending interstitial):
    // ad continue once per run; coin continue at an escalating price
    $("btn-continue").disabled=Game.revived||!Ads.rewardedReady();
    const revPrice=Game.nextRevivePrice();
    $("o-revcost").textContent=revPrice;
    $("btn-coinrevive").disabled=S.coins<revPrice;
    $("btn-doublexp").disabled=Game.runXPGained<=0||!Ads.rewardedReady();
    S.lastRun=score;
    S.runsPlayed++; S.deaths++;
    Missions.progress({run:true,score});
    save();
    this.showScreen("over");
    Ads.onGameOver();       // marks interstitial pending; fires only after revive is resolved
  },

  /* re-sync the game-over screen's level/XP bar (after rewarded 2× XP) */
  gameOverXPRefresh(){
    $("o-level").textContent=S.level;
    const need=xpForLevel(S.level);
    $("o-xptext").textContent=`${S.xpInLevel} / ${need} XP`;
    $("o-xpfill").style.width=`${clamp(S.xpInLevel/need*100,0,100)}%`;
  },

  toast(txt,big=false){
    const box=$("toasts");   // cap the stack: a burst of unlocks/level-ups
    while(box.children.length>=4) box.firstChild.remove();
    const div=document.createElement("div");
    div.className="toast"+(big?" big":"");
    div.textContent=txt;
    $("toasts").appendChild(div);
    setTimeout(()=>div.remove(),3200);
  },
  levelFx(lvl){
    const el=$("lvlfx");
    $("lvlfx-num").textContent=lvl;
    el.classList.remove("on");
    void el.offsetWidth;      // restart CSS animation
    el.classList.add("on");
    setTimeout(()=>el.classList.remove("on"),1200);
  },

  /* ── SHOP ──────────────────────────────────────────────────────────
     Hybrid model (chosen for continuity with the existing XP curve):
     lifetime XP unlocks a TIER's availability (unlockCost — the same
     endless thresholds as before), coins BUY the item (coinPrice).
     Item states: XP-locked → buyable (+NEW badge) → owned → equipped. */
  renderUnlocks(){
    $("u-xp").textContent=S.lifetimeXP;
    $("u-coins").textContent=S.coins;
    const grid=$("u-grid"); grid.innerHTML="";
    const cat=this.curTab;
    const avail=unlockedCount();        // XP-availability (shared tier curve)
    const seen=S.shopSeen[cat];
    for(let i=0;i<avail+4;i++){         // tease the next 4 XP-locked tiers
      const cell=document.createElement("button");
      cell.className="cell";
      const item=CAT_ITEM[cat](i);
      // cell IS the preview: swatch / gradient / glyph in the item's style
      if(cat==="trail")      cell.style.background=item.c;
      else if(cat==="skin"){ cell.style.background="#20264a"; cell.style.color=item.c; cell.textContent=item.shape; }
      else if(cat==="bg")    cell.style.background=`linear-gradient(${item.top},${item.bot})`;
      else if(cat==="sound"){cell.style.background="#20264a"; cell.style.fontSize="22px"; cell.textContent="♪"; }
      else{                  cell.style.background="#20264a"; cell.style.fontSize="20px"; cell.textContent="✹"; }
      cell.title=item.name;
      const owned=S.owned[cat].includes(i);
      if(i>=avail){                     // XP-locked: needs more lifetime XP
        cell.classList.add("lock");
        cell.innerHTML+=`<div class="cost">⭐${unlockCost(i)}xp</div>`;
        // a dead tap reads as broken — explain the gate instead
        cell.addEventListener("click",()=>{
          Audio2.ui();
          this.toast(`⭐ Unlocks at ${unlockCost(i)} lifetime XP — you have ${S.lifetimeXP}. Coins buy it once unlocked.`);
        });
      }else if(!owned){                 // available: coins buy it (two-tap)
        const armed=this.pendingBuy&&this.pendingBuy.cat===cat&&this.pendingBuy.i===i;
        if(armed) cell.classList.add("arm");
        cell.innerHTML+=`<div class="cost">${armed?"tap = buy!":"🪙"+coinPrice(i)}</div>`;
        if(i>=seen&&!armed) cell.innerHTML+=`<div class="badge">NEW</div>`;
        cell.addEventListener("click",()=>this.buy(cat,i));
      }else{                            // owned: tap to equip (+preview)
        if(S.equip[cat]===i) cell.classList.add("eq");
        cell.addEventListener("click",()=>{
          S.equip[cat]=i; save(); Haptics.tap();
          if(cat==="sound") Audio2.preview(i); else Audio2.ui();
          if(cat==="trail") this.applyScheme();
          if(cat==="fx")    // live demo burst behind the translucent panel
            Particles.perfectFX(Game.vw/2,Game.camY+Game.vh/2,40,this.trailColor(),fxItem(i));
          this.renderUnlocks();
        });
      }
      grid.appendChild(cell);
    }
    S.shopSeen[cat]=avail; save();      // this tab's tiers are now "seen"
    $("shop-dot").classList.toggle("hidden",!this.shopHasNew());
  },
  /* two-tap purchase (no confirm() — blocked in sandboxed WebViews):
     first tap arms the cell + previews, second tap within 3s buys. */
  buy(cat,i){
    const price=coinPrice(i), item=CAT_ITEM[cat](i);
    if(S.coins<price){
      if(cat==="sound") Audio2.preview(i);
      this.toast(`Need 🪙${price-S.coins} more for ${item.name}`);
      return;
    }
    const armed=this.pendingBuy&&this.pendingBuy.cat===cat&&this.pendingBuy.i===i;
    if(!armed){
      clearTimeout(this.pendingBuyT);
      this.pendingBuy={cat,i};
      if(cat==="sound") Audio2.preview(i); else Audio2.ui();
      this.toast(`${item.name} — 🪙${price}. Tap again to buy`);
      this.pendingBuyT=setTimeout(()=>{ this.pendingBuy=null; this.renderUnlocks(); },3000);
      this.renderUnlocks();
      return;
    }
    clearTimeout(this.pendingBuyT); this.pendingBuy=null;
    S.coins-=price; S.owned[cat].push(i); S.equip[cat]=i;
    save(); Audio2.unlock(); Haptics.perfect();
    this.toast(`✦ ${item.name} — equipped!`,true);
    if(cat==="trail") this.applyScheme();
    this.renderUnlocks();
  },
  shopHasNew(){                          // any buyable tier not yet seen?
    const avail=unlockedCount();
    return SHOP_CATS.some(c=>avail>S.shopSeen[c]);
  },
  /* equipped colour scheme drives the trail AND the UI accent palette */
  applyScheme(){
    document.documentElement.style.setProperty("--accent",this.trailColor());
  },
};

/* ═══════════════════════════════════════════════════════════════════════
   ADS — AdMob via @capacitor-community/admob + Google UMP consent.

   Wired but inert outside the native app: every entry point feature-
   detects the plugin and no-ops with a console log, so browser dev
   never crashes and never even touches ad code paths.

   Placement policy:
   · Banner       → anchored bottom, shown once at app start; its height
                    is fed into --banner-h so no UI sits behind it.
   · Interstitial → on game-over, only every Nth death
                    (CONFIG.ADS_INTERSTITIAL_EVERY_N_DEATHS) AND at most
                    once per ADS_INTERSTITIAL_MIN_INTERVAL_S seconds —
                    and NEVER while a rewarded "continue" is still on the
                    table: an eligible interstitial goes PENDING and only
                    fires once revive is unavailable or declined (Retry/
                    Home). Watching any rewarded ad cancels it for that
                    death: the rewarded impression always wins.
   · Rewarded     → user-initiated only: "2× XP" and "CONTINUE" buttons
                    on the game-over screen.
   · UMP consent  → requested BEFORE initialize/ads, per Google policy;
                    "Privacy & ad options" button re-shows the form.
   ═══════════════════════════════════════════════════════════════════════ */
const Ads={
  interstitialLoaded:false, rewardedLoaded:false,
  lastInterstitialAt:0, pendingReward:null, doubleXPUsed:false,
  interstitialPending:false,   // cadence-eligible, waiting on the revive decision

  plugin(){ return (CONFIG.ADS_ENABLED && window.Capacitor?.isNativePlatform?.() && window.Capacitor?.Plugins?.AdMob) || null; },

  async init(){
    const AdMob=this.plugin();
    if(!AdMob){ console.log("[ads] AdMob plugin not available — ads disabled (browser/dev mode)"); return; }
    try{
      /* ── 1. UMP consent flow (GDPR/UK/US-state). Must complete before
             ads are requested. Inert outside consent regions. ───────── */
      try{
        const info=await AdMob.requestConsentInfo({});
        if(info?.isConsentFormAvailable && info?.status==="REQUIRED"){
          await AdMob.showConsentForm();
        }
        S.consentDone=true; save();
      }catch(e){ console.warn("[ads] consent flow failed (continuing)",e); }

      /* ── 2. SDK init. ADS_TESTING_MODE requests test ads everywhere. ── */
      await AdMob.initialize({ initializeForTesting: CONFIG.ADS_TESTING_MODE });

      /* ── 3. Event listeners (loaded/dismissed/reward) ────────────── */
      AdMob.addListener("bannerAdSizeChanged",(size)=>{
        // reserve layout space so the banner never covers game UI
        const h=clamp(Math.round(size?.height||0),0,140);
        document.documentElement.style.setProperty("--banner-h",h+"px");
        Game.resize();
      });
      AdMob.addListener("onInterstitialAdLoaded",()=>{ this.interstitialLoaded=true; });
      AdMob.addListener("onInterstitialAdDismissed",()=>{ this.interstitialLoaded=false; this.prepInterstitial(); });
      AdMob.addListener("onRewardedVideoAdLoaded",()=>{ this.rewardedLoaded=true; });
      AdMob.addListener("onRewardedVideoAdReward",()=>{ this.grantPendingReward(); });
      AdMob.addListener("onRewardedVideoAdDismissed",()=>{ this.rewardedLoaded=false; this.pendingReward=null; this.prepRewarded(); });

      /* ── 4. Banner up immediately, full-screen formats pre-loaded. ── */
      await AdMob.showBanner({
        adId: CONFIG.BANNER_AD_UNIT_ID,
        adSize: "ADAPTIVE_BANNER",
        position: "BOTTOM_CENTER",
        margin: 0,
        isTesting: CONFIG.ADS_TESTING_MODE,
      });
      this.prepInterstitial();
      this.prepRewarded();
      console.log("[ads] initialized");
    }catch(e){ console.warn("[ads] init failed — continuing without ads",e); }
  },

  async prepInterstitial(){
    const AdMob=this.plugin(); if(!AdMob) return;
    try{ await AdMob.prepareInterstitial({ adId: CONFIG.INTERSTITIAL_AD_UNIT_ID, isTesting: CONFIG.ADS_TESTING_MODE }); }
    catch(e){ console.warn("[ads] interstitial prepare failed",e); }
  },
  async prepRewarded(){
    const AdMob=this.plugin(); if(!AdMob) return;
    try{ await AdMob.prepareRewardVideoAd({ adId: CONFIG.REWARDED_AD_UNIT_ID, isTesting: CONFIG.ADS_TESTING_MODE }); }
    catch(e){ console.warn("[ads] rewarded prepare failed",e); }
  },

  rewardedReady(){ return this.rewardedLoaded; },

  /* game-over hook: decide interstitial ELIGIBILITY only — never show
     here. The revive decision resolves first (see reviveDeclined /
     showRewarded); the interstitial fires only after it. */
  onGameOver(){
    this.doubleXPUsed=false;
    const AdMob=this.plugin();
    if(!AdMob){ console.log("[ads] (no-op) interstitial check, death #"+S.deaths); return; }
    const everyN=CONFIG.ADS_INTERSTITIAL_EVERY_N_DEATHS;
    const cooled=(Date.now()-this.lastInterstitialAt)/1000>=CONFIG.ADS_INTERSTITIAL_MIN_INTERVAL_S;
    this.interstitialPending=this.interstitialLoaded && cooled && S.deaths%everyN===0;
    // Revive not on offer this death (ad continue spent AND coins short)?
    // Then there's nothing to contend with — resolve immediately.
    const reviveOffered=(!Game.revived && this.rewardedLoaded) || S.coins>=Game.nextRevivePrice();
    if(!reviveOffered) this.flushInterstitial();
  },
  /* player passed on revive: Retry / Home tapped on the over screen */
  reviveDeclined(){ this.flushInterstitial(); },
  async flushInterstitial(){
    if(!this.interstitialPending) return;
    this.interstitialPending=false;
    const AdMob=this.plugin(); if(!AdMob) return;
    try{
      Audio2.suspend();               // never play game audio under an ad
      await AdMob.showInterstitial();
      this.lastInterstitialAt=Date.now();
    }catch(e){ console.warn("[ads] interstitial show failed",e); this.prepInterstitial(); }
  },

  async showRewarded(kind){
    const AdMob=this.plugin();
    if(!AdMob){ console.log("[ads] (no-op) rewarded requested:",kind); return; }
    if(!this.rewardedLoaded) return;
    this.interstitialPending=false;   // rewarded impression wins this death
    this.pendingReward=kind;
    try{ Audio2.suspend(); await AdMob.showRewardVideoAd(); }
    catch(e){ console.warn("[ads] rewarded show failed",e); this.pendingReward=null; this.prepRewarded(); }
  },
  rewardDoubleXP(){
    if(this.doubleXPUsed) return;
    this.showRewarded("doublexp");
  },
  rewardContinue(){
    if(Game.revived) return;
    this.showRewarded("continue");
  },
  /* fires only on the SDK's reward event → user finished the ad */
  grantPendingReward(){
    const kind=this.pendingReward; this.pendingReward=null;
    if(kind==="doublexp"){
      this.doubleXPUsed=true;
      const extra=Math.round(Game.runXPGained*(CONFIG.REWARDED_DOUBLE_XP_MULT-1));
      Progress.gainXP(extra,true);      // raw: multipliers already applied
      Game.runXPGained+=extra;
      $("o-xp").textContent=`+${Game.runXPGained} XP  (${CONFIG.REWARDED_DOUBLE_XP_MULT}× rewarded!)`;
      $("btn-doublexp").disabled=true;
      UI.toast(`🎁 +${extra} bonus XP!`,true);
      UI.gameOverXPRefresh?.();
    }else if(kind==="continue"){
      UI.toast("🎁 RUN CONTINUES!",true);
      Game.revive(true);   // true = consumes the once-per-run AD continue
    }
  },

  /* "Privacy & ad options" — re-show the UMP form so users can change
     consent any time (required by Google in consent regions). */
  async showPrivacyOptions(){
    const AdMob=this.plugin();
    if(!AdMob){ UI.toast("Ad privacy options appear here in the Android build"); return; }
    try{
      if(typeof AdMob.showPrivacyOptionsForm==="function") await AdMob.showPrivacyOptionsForm();
      else await AdMob.showConsentForm();
    }catch(e){ console.warn("[ads] privacy form unavailable",e); }
  },
};

/* ═══════════════════════════════════════════════════════════════════════
   LIFECYCLE — pause loop & kill audio when backgrounded (browser
   visibility API + Capacitor App plugin when native).
   ═══════════════════════════════════════════════════════════════════════ */
function wireLifecycle(){
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){ Audio2.suspend(); UI.pause(); }
  });
  const App=window.Capacitor?.Plugins?.App;
  if(App){
    App.addListener("appStateChange",({isActive})=>{
      if(!isActive){ Audio2.suspend(); UI.pause(); }
    });
    // Android hardware back: pause instead of killing the activity mid-run
    App.addListener("backButton",()=>{
      if(Game.state==="playing") UI.pause();
      else if(Game.state==="paused"||Game.state==="over") UI.home();
      else App.exitApp();
    });
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════════════ */
Particles.init();
Game.init();
UI.init();
Missions.ensure();
UI.renderMissions();
Progress.checkDaily();
wireLifecycle();
Ads.init();
console.log("[orbit-rush] ready — level",S.level,"best",S.best);
</script>
</body>
</html>
